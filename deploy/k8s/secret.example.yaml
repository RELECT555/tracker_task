# ШАБЛОН. Не коммитьте сюда настоящие значения и не добавляйте файл в kustomization.
# В реальном кластере Secret создаётся из хранилища секретов (External Secrets, Sealed Secrets,
# Vault, Azure Key Vault CSI) или вручную:
#
#   kubectl -n tracker create secret generic tracker-api-secrets \
#     --from-literal=DATABASE_URL='postgresql://USER:PASSWORD@HOST:5432/tracker?schema=public&sslmode=require' \
#     --from-literal=JWT_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=LOCAL_ADMIN_PASSWORD='...' \
#     --from-literal=ROADMAP_ENCRYPTION_KEY="$(openssl rand -hex 32)"
apiVersion: v1
kind: Secret
metadata:
  name: tracker-api-secrets
  namespace: tracker
type: Opaque
stringData:
  # Обязательные
  DATABASE_URL: "<postgresql://USER:PASSWORD@HOST:5432/tracker?schema=public&sslmode=require>"
  JWT_SECRET: "<random, min 32 chars>"
  # Только для AUTH_PROVIDER=local (минимум 12 символов в production)
  LOCAL_ADMIN_PASSWORD: "<min 12 chars>"
  # Ключ шифрования сохранённых в админке данных интеграции. Если не задан, берётся JWT_SECRET,
  # и тогда его смена сделает сохранённые доступы Azure нечитаемыми. Задайте отдельный и не меняйте.
  ROADMAP_ENCRYPTION_KEY: "<random, min 32 chars>"
  # Необязательные
  AZURE_DEVOPS_PAT: ""
  HRNNG_API_KEY: ""
