apiVersion: apps/v1
kind: Deployment
metadata:
  name: tracker-api
  namespace: tracker
  labels:
    app.kubernetes.io/name: tracker-api
    app.kubernetes.io/component: api
spec:
  # 1 реплика намеренно: фоновые задачи (синхронизация с Azure DevOps каждую минуту,
  # импорт проектов каждые 5 минут) запускаются на КАЖДОЙ реплике без leader election.
  # Алерты и write-back к нескольким репликам готовы, импорт — нет (лишние запросы в Azure DevOps).
  # Подробности: docs/deploy.md, раздел «Масштабирование».
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: tracker-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tracker-api
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: tracker-api
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      # Миграции БД применяются перед каждым стартом новой версии.
      # `prisma migrate deploy` берёт advisory-lock в PostgreSQL, поэтому параллельный запуск безопасен.
      # Если миграция упала, новый под не стартует, а старая версия продолжает обслуживать трафик.
      initContainers:
        - name: migrate
          image: registry.example.com/tracker/api-migrate:0.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: tracker-api-secrets
                  key: DATABASE_URL
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp

      containers:
        - name: api
          image: registry.example.com/tracker/api:0.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
              protocol: TCP
          envFrom:
            - configMapRef:
                name: tracker-api-config
            - secretRef:
                name: tracker-api-secrets
          env:
            # Куча V8 ~75% от лимита памяти контейнера, чтобы под не убивал OOMKiller раньше GC.
            - name: NODE_OPTIONS
              value: "--max-old-space-size=384"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi

          # startup: даёт API до ~2 минут на старт (подключение к БД, инициализация Nest),
          # пока liveness/readiness не начали работать.
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 40
          # liveness: процесс жив. НЕ проверяет БД: падение PostgreSQL не должно
          # приводить к перезапускам подов (это только усугубит ситуацию).
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # readiness: под получает трафик, только если отвечает база (иначе 503 и под выводится из Service).
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              # Даём Ingress убрать под из балансировки до начала остановки.
              exec:
                command: ["sleep", "5"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
