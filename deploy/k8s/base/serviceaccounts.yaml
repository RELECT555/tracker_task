# Приложению не нужен доступ к Kubernetes API, поэтому токен в поды не монтируем.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tracker-api
  namespace: tracker
  labels:
    app.kubernetes.io/name: tracker-api
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tracker-web
  namespace: tracker
  labels:
    app.kubernetes.io/name: tracker-web
automountServiceAccountToken: false
