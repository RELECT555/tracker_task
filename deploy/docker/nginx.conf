# Раздача собранного SPA. Слушаем 8080 (непривилегированный порт), пишем только в /tmp.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types
        text/plain text/css text/javascript application/javascript application/json
        image/svg+xml application/wasm;

    # Проба для Kubernetes и HEALTHCHECK. Не пишем в access-лог, чтобы не засорять его.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Файлы Vite с хэшем в имени: кэшируем на год.
    # add_header в location отменяет унаследованные, поэтому заголовки безопасности подключаем явно.
    # ^~ — чтобы регулярка для картинок ниже не перехватывала файлы из /assets/.
    location ^~ /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Остальная статика (иконки, wasm): без вечного кэша.
    location ~* \.(?:ico|svg|wasm|png|jpg|jpeg|webp|woff2?)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    # API живёт за Ingress, а не здесь. Явный 404 лучше, чем index.html вместо JSON.
    location ^~ /api/ {
        default_type application/json;
        return 404 '{"error":{"code":"NOT_FOUND","message":"API is served by a different upstream"}}';
    }

    # SPA: любой маршрут отдаёт index.html, который не кэшируем, чтобы релиз доезжал сразу.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
